<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scorebook">
<meta name="color-scheme" content="light dark">
<title>Scorebook Mockups</title>
<!--
  Scorebook app: clickable mockups.
  One self-contained file: all styles, icons and behavior are inline, nothing loads from the internet.
  On a computer it shows an iPhone-sized frame with a screen index on the left and design notes on the right.
  On a phone it fills the screen; the thin bar at the top opens the screen index.
  The baseball arithmetic in here is a rough stand-in so the taps feel real. The app's rules engine does the real work.
-->
<style>
/* ---------- Color tokens: light mode is the outdoor, in-the-sun default ---------- */
:root{
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --serif:"New York",ui-serif,Georgia,"Times New Roman",serif;
  --top:54px; --sb:34px;
  --desk:#E3E5EA; --panel:#FFFFFF;
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#E9E9EF; --surface3:#D9D9E1;
  --ink:#0A0A0C; --ink2:#2B2B30; --ink3:#5E5E66; --line:#D0D0D7;
  --us:#C41E3A; --us-deep:#9F162E; --us-soft:#FCE8EC; --us-text:#AE1A33;
  --them:#46535F; --them-deep:#333E49; --them-soft:#E4E8EC; --them-text:#3A4652;
  --ball:#12803E; --strike:#F3A712; --strike-ink:#161616; --foul:#2B2E35; --play:#0B57C9; --play2:#2C6FDB;
  --music:#5A3BC2; --amber:#F3A712; --danger:#C62828; --ok:#12803E;
  --grass:#C3E3B8; --grass2:#B1D8A3; --dirt:#E4C99C; --chalk:#FFFFFF; --baseline:#8B775A;
  --bug:#111216; --bug-line:#2A2C33;
  --paper:#F3EEE1; --paper-ink:#1A1712;
  --sh:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#0D0E11; --panel:#1C1C1E;
    --bg:#000000; --surface:#1C1C1E; --surface2:#2A2A2E; --surface3:#3A3A3F;
    --ink:#FFFFFF; --ink2:#E6E6EB; --ink3:#A0A0A8; --line:#38383D;
    --us:#D42540; --us-deep:#A51C31; --us-soft:#3A1018; --us-text:#FF7186;
    --them:#5B6A79; --them-deep:#43505D; --them-soft:#1D242B; --them-text:#B4C1CE;
    --ball:#199A4D; --strike:#FFB625; --foul:#46494F; --play:#2A76EC; --play2:#4A8CF2;
    --music:#7656E2;
    --grass:#1C3820; --grass2:#224428; --dirt:#4C3B27; --chalk:#E8E8E8; --baseline:#CDB892;
    --bug:#141519; --bug-line:#30323A;
    --sh:none;
  }
}
:root[data-theme="dark"]{
  --desk:#0D0E11; --panel:#1C1C1E;
  --bg:#000000; --surface:#1C1C1E; --surface2:#2A2A2E; --surface3:#3A3A3F;
  --ink:#FFFFFF; --ink2:#E6E6EB; --ink3:#A0A0A8; --line:#38383D;
  --us:#D42540; --us-deep:#A51C31; --us-soft:#3A1018; --us-text:#FF7186;
  --them:#5B6A79; --them-deep:#43505D; --them-soft:#1D242B; --them-text:#B4C1CE;
  --ball:#199A4D; --strike:#FFB625; --foul:#46494F; --play:#2A76EC; --play2:#4A8CF2;
  --music:#7656E2;
  --grass:#1C3820; --grass2:#224428; --dirt:#4C3B27; --chalk:#E8E8E8; --baseline:#CDB892;
  --bug:#141519; --bug-line:#30323A;
  --sh:none;
}

/* ---------- Page and phone frame ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--desk);font-family:var(--sys);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:disabled{cursor:default}
input{font:inherit;color:inherit}
.stage{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;gap:32px;padding:20px}
.phone{position:relative;flex:none;width:393px;height:852px;border-radius:56px;background:var(--bg);overflow:hidden;
  box-shadow:0 0 0 10px #0c0c0e,0 0 0 12px #3b3b42,0 40px 90px rgba(0,0,0,.35);transform-origin:center center}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;
  padding:6px 30px 0 46px;font-weight:600;font-size:16px;z-index:5;background:var(--bg);color:var(--ink)}
.status .sicons{display:flex;gap:6px;align-items:center}
.island{position:absolute;left:50%;top:11px;width:122px;height:35px;border-radius:20px;background:#000;transform:translateX(-50%)}
.phone[data-top="us"] .status{background:var(--us);color:#fff}
.phone[data-top="them"] .status{background:var(--them);color:#fff}
.phone[data-top="surface"] .status{background:var(--surface)}
.app{position:absolute;top:var(--top);left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;transform:translateX(-50%);z-index:80;pointer-events:none}
.mockbar{display:none}
.panel{flex:none;width:290px;max-height:min(852px,calc(100vh - 40px));overflow:auto;background:var(--panel);border-radius:18px;padding:18px 18px 22px;font-size:14px;line-height:1.4;box-shadow:var(--sh)}
@media (max-width:1150px){.panel.right{display:none}}
@media (max-width:384px){.band-title span{display:none}}
/* Phones and small windows: the app fills the screen, and a thin mockup bar replaces the side panels */
@media (max-width:760px){
  :root{--top:calc(32px + env(safe-area-inset-top));--sb:max(env(safe-area-inset-bottom),8px)}
  .stage{padding:0;display:block}
  .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none;transform:none!important}
  .status,.homebar,.panel{display:none}
  .mockbar{display:flex;position:absolute;top:0;left:0;right:0;height:var(--top);padding:env(safe-area-inset-top) 8px 0;align-items:center;gap:8px;
    background:#1b1b1f;color:#fff;font-size:12px;z-index:90}
}
.mockbar .mb-btn{background:#34343a;border-radius:8px;padding:4px 9px;font-weight:600;white-space:nowrap}
.mockbar .mb-mid{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.mockbar .mb-taps{font-weight:700;white-space:nowrap;background:#F3A712;color:#111;border-radius:8px;padding:4px 8px}

/* ---------- Mockup side panels (not part of the app) ---------- */
.panel h2{font-size:17px;margin:0 0 2px}
.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:16px 0 6px}
.panel .sub{color:var(--ink3);font-size:13px;margin:0 0 10px}
.ix a,.ix button.lnk{display:block;width:100%;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.ix button.lnk:hover{background:var(--surface2)}
.ix button.lnk.cur{background:var(--us-soft);color:var(--us-text);font-weight:600}
.ix button.walk{display:flex;justify-content:space-between;gap:8px}
.ix button.walk span:last-child{color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.segm{display:flex;background:var(--surface2);border-radius:9px;padding:2px;gap:2px}
.segm button{flex:1;padding:5px 6px;border-radius:7px;font-size:13px;font-weight:600;text-align:center;color:var(--ink2)}
.segm button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tapbox{background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:12px}
.tapbox b{font-size:28px;font-variant-numeric:tabular-nums}
.note p{margin:0 0 10px}
.note .decide{background:#FFF4D6;color:#3b2a00;border-radius:10px;padding:10px 12px;margin-top:10px}
:root[data-theme="dark"] .note .decide{background:#3a2f12;color:#ffe6a6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .note .decide{background:#3a2f12;color:#ffe6a6}}
.script{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.script span{background:var(--surface2);border-radius:6px;padding:2px 7px;font-size:13px}
.script span.done{background:var(--ok);color:#fff}
.script span.next{background:var(--amber);color:#111;font-weight:700}
.ixov{position:absolute;inset:0;z-index:95;background:var(--panel);overflow:auto;padding:calc(env(safe-area-inset-top) + 12px) 16px 40px;display:none}
.ixov.open{display:block}
.ixov .close{position:sticky;top:0;float:right;background:var(--surface2);border-radius:10px;padding:8px 12px;font-weight:700}
.coach{animation:coach 1.1s ease-in-out infinite;outline:3px solid var(--amber)!important;outline-offset:2px;position:relative;z-index:2}
g.coach{outline:none!important;animation:none}
g.coach .fc{stroke:var(--amber)!important;stroke-width:5!important}
@keyframes coach{0%,100%{outline-color:rgba(243,167,18,1)}50%{outline-color:rgba(243,167,18,.25)}}

/* ---------- Shared app pieces ---------- */
.screen{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--sb) + 16px)}
.ic{flex:none;display:block}
.nav{flex:none;height:50px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;background:var(--bg)}
.nav .l{justify-self:start}.nav .r{justify-self:end}
.nav .t{font-weight:700;font-size:17px;text-align:center;white-space:nowrap}
.nav .t small{display:block;font-weight:500;font-size:12px;color:var(--ink3)}
.navbtn{display:flex;align-items:center;gap:2px;color:var(--play);font-size:17px;min-height:44px;padding:0 8px;font-weight:500}
.navbtn.bold{font-weight:700}
.large{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 0}
.pad{padding:0 16px}
.eyebrow{font-size:13px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.sec{font-size:13px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;width:100%;border-bottom:1px solid var(--line);background:var(--surface)}
.card .row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t1{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--ink3)}
.num{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:var(--us);font-variant-numeric:tabular-nums}
.num.them{background:var(--them)}
.num.lg{width:72px;height:72px;border-radius:20px;font-size:34px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 6px;vertical-align:2px;margin-left:4px;white-space:nowrap}
.tag.nr{background:var(--amber);color:#111}
.tag.re{background:var(--surface3);color:var(--ink2)}
.tag.us{background:var(--us-soft);color:var(--us-text)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;font-weight:700;font-size:17px;padding:0 16px;width:100%}
.btn.pri{background:var(--play);color:#fff}
.btn.us{background:var(--us);color:#fff}
.btn.sec2{background:var(--surface2);color:var(--ink)}
.btn.out{background:var(--surface);color:var(--play);border:1.5px solid var(--line)}
.btn.rec{background:var(--danger);color:#fff}
.btn:disabled{opacity:.4}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:600;font-size:15px;text-align:center;color:var(--ink2);padding:0 6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.toggle{width:51px;height:31px;border-radius:16px;background:var(--surface3);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .15s}
.toggle.on{background:var(--ok)}.toggle.on::after{left:22px}
.stepper{display:flex;align-items:center;gap:0;background:var(--surface2);border-radius:10px;overflow:hidden}
.stepper button{width:44px;height:38px;font-size:22px;font-weight:600;display:grid;place-items:center}
.stepper b{min-width:34px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.chipbtn{min-height:40px;padding:0 14px;border-radius:20px;background:var(--surface2);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chipbtn.on{background:var(--ink);color:var(--bg)}
.chipbtn.guess{background:transparent;border:2px dashed var(--ink3);color:var(--ink)}
.dots{display:flex;gap:5px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;display:block}
.dots i.on{background:currentColor}
.kback{display:inline-block;transform:scaleX(-1)}
.toast{position:absolute;left:12px;right:12px;top:calc(var(--top) + 8px);z-index:70;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-weight:600;font-size:15px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(-8px);transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.empty{color:var(--ink3);font-size:14px;padding:14px}

/* ---------- Field drawing ---------- */
.field{width:100%;height:100%;display:block}
.g-grass{fill:var(--grass)}.g-grass2{fill:var(--grass2)}.g-dirt{fill:var(--dirt)}
.g-line{stroke:var(--chalk);stroke-width:2;fill:none}
.base{fill:var(--chalk);stroke:var(--baseline);stroke-width:1.5}
.base.occ.us{fill:var(--us);stroke:#fff;stroke-width:2.5}
.base.occ.them{fill:var(--them);stroke:#fff;stroke-width:2.5}
.pill rect{fill:var(--us);stroke:#fff;stroke-width:2}
.pill.them rect{fill:var(--them)}
.pill text{fill:#fff;font:700 14px var(--sys)}
.pill.out rect{fill:var(--surface);stroke:var(--danger);stroke-width:2;stroke-dasharray:4 3}
.pill.out text{fill:var(--danger)}
.pill rect.hit{fill:transparent;stroke:none}
.fld .fc{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.fld .fn{font:800 19px var(--sys);fill:var(--ink);text-anchor:middle}
.fld .fname{font:700 11px var(--sys);fill:var(--ink2);text-anchor:middle;paint-order:stroke;stroke:var(--grass);stroke-width:3px}
.fld.sel .fc{fill:var(--play);stroke:var(--play)}
.fld.sel .fn{fill:#fff}
.fld.err .fc{fill:var(--danger);stroke:var(--danger)}
.fld.err .fn{fill:#fff}
.fld.faint{opacity:.45;pointer-events:none}
.fld .hit{fill:transparent}
.badge circle{fill:var(--amber);stroke:var(--surface);stroke-width:2}
.badge text{font:800 12px var(--sys);fill:#111;text-anchor:middle}
.throw{stroke:var(--play);stroke-width:3;fill:none;stroke-dasharray:6 5}
.ah{fill:var(--play)}
.runpath{stroke:var(--arrow);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.runpath.out{stroke:var(--danger);stroke-dasharray:3 7;stroke-width:4}
.ahr{fill:var(--arrow)}
.xmark{stroke:var(--danger);stroke-width:4;stroke-linecap:round}
.mound{fill:var(--dirt);stroke:var(--baseline);stroke-width:1}
.locmark circle{fill:var(--play);stroke:#fff;stroke-width:3}
.locmark .ring{fill:none;stroke:var(--play);stroke-width:2;opacity:.5}

/* ---------- Batting screen, layout A (field view) ---------- */
.screen.bat{background:var(--bg)}
.band{flex:none;color:#fff;padding:0 8px 8px}
.t-us .band{background:var(--us)}
.t-them .band{background-color:var(--them);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 10px,transparent 10px 20px)}
.band-row{display:flex;align-items:center;gap:6px;height:46px}
.icbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.band .icbtn{color:#fff}
.band-title{flex:1;min-width:0;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bandbtn{display:flex;align-items:center;gap:4px;height:36px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.18);font-weight:700;font-size:14px;color:#fff;white-space:nowrap}
.board{display:grid;grid-template-columns:66px 1fr 100px 70px;align-items:center;background:rgba(0,0,0,.2);border-radius:14px;height:64px;padding:0 4px}
.board>div{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;border-right:1px solid rgba(255,255,255,.18)}
.board>div:last-child{border-right:0}
.bd-inn b{font-size:24px;font-weight:800;line-height:1}
.bd-inn span,.bd-count span,.bd-outs span{font-size:11px;font-weight:600;opacity:.85;margin-top:4px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.bd-score{align-items:stretch!important;padding:0 10px}
.bd-score div{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;opacity:.6;line-height:1.25}
.bd-score div.bat{opacity:1}
.bd-score div.bat span::before{content:"▸ "}
.bd-score b{font-size:21px;font-variant-numeric:tabular-nums}
.bd-count b{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bd-count b i{font-style:normal;opacity:.6;margin:0 1px}
.bd-outs .dots i{width:15px;height:15px}
.fieldwrap{flex:1 1 0;min-height:92px;position:relative;background:var(--grass);overflow:hidden}
.fieldwrap .field{position:absolute;inset:0}
.fw-ondeck,.fw-pitch{position:absolute;bottom:8px;background:var(--surface);border-radius:12px;padding:6px 10px;font-size:13px;line-height:1.2;box-shadow:0 2px 8px rgba(0,0,0,.15);max-width:48%}
.fw-ondeck{left:8px;color:var(--ink3)}
.fw-ondeck b,.fw-pitch b{display:block;color:var(--ink);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fw-pitch{right:8px;text-align:right;color:var(--ink3);min-height:44px}
.cobanner{position:absolute;left:10px;right:10px;top:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.cobanner .cb-t{flex:1;min-width:0}
.cobanner b{display:block;font-size:19px}
.cobanner span{font-size:14px;opacity:.8}
.cobanner button{background:var(--bg);color:var(--ink);border-radius:10px;padding:0 12px;min-height:40px;font-weight:700;font-size:14px;white-space:nowrap}
.batter{flex:none;display:flex;align-items:center;gap:12px;padding:9px 12px 9px 14px;background:var(--surface);border-bottom:1px solid var(--line);width:100%}
.batter .num{width:50px;height:50px;font-size:23px;border-radius:13px}
.bt-main{flex:1;min-width:0}
.bt-name{font-size:21px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.bt-sub{font-size:14px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-sub b{color:var(--ink2);font-weight:700}
.addname{color:var(--play);font-weight:700}
.chips{flex:none;display:flex;gap:8px;padding:8px 12px 0}
.chip{flex:1;min-height:44px;border-radius:12px;background:var(--surface2);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;padding:0 6px;color:var(--ink)}
.chip.undo{flex:1.9;justify-content:flex-start;padding:0 12px;overflow:hidden}
.chip.undo span{overflow:hidden;text-overflow:ellipsis}
.chip:disabled{opacity:.45}
.chip.k3{flex:2.2;background:var(--amber);color:#111}
.pad2{flex:0 1 190px;min-height:132px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;padding:10px 12px}
.cb{border-radius:18px;font-weight:800;font-size:27px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;height:100%;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);text-align:center;line-height:1.05;transition:transform .06s,filter .06s;letter-spacing:-.01em}
.cb small{font-size:13px;font-weight:600;opacity:.88;letter-spacing:0}
.cb:active{transform:scale(.97);filter:brightness(.9)}
.cb.ball{background:var(--ball)}
.cb.strike{background:var(--strike);color:var(--strike-ink)}
.cb.foul{background:var(--foul)}
.cb.play{background:var(--play)}
.cb.out{background:var(--play)}
.cb.safe{background:var(--play2)}
.cbw{position:relative;min-height:0}
.pad2 .cb.strike{padding-right:66px}
.called{position:absolute;top:6px;right:6px;bottom:6px;width:60px;border-radius:12px;text-align:center;background:rgba(0,0,0,.14);color:var(--strike-ink);font-weight:800;font-size:13px;z-index:1}
.songbar{flex:none;display:flex;align-items:center;gap:12px;margin:0 12px calc(var(--sb) + 2px);min-height:64px;border-radius:18px;background:var(--us);color:#fff;padding:0 14px 0 10px;width:calc(100% - 24px)}
.songbar .sb-ic{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--us);display:grid;place-items:center;flex:none}
.songbar .sb-t{flex:1;min-width:0}
.songbar .sb-t b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songbar .sb-t span{font-size:13px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.songbar.on{background:var(--us-deep);box-shadow:0 0 0 3px var(--us) inset}
.songbar.music{background:var(--music)}.songbar.music .sb-ic{color:var(--music)}
.songbar.music.on{filter:brightness(.88)}
.songbar.none{background:var(--us-soft);color:var(--us-text)}
.songbar.none .sb-ic{background:var(--us);color:#fff}
.songbar.them{background:var(--surface2);color:var(--ink3);border:2px dashed var(--line);cursor:default}
.songbar.them .sb-ic{background:transparent;color:var(--ink3)}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px}
.eq i{width:4px;background:#fff;border-radius:2px;height:30%;animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.45s}.eq i:nth-child(4){animation-delay:-.6s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

/* ---------- Batting screen, layout B (big buttons) ---------- */
.topbar{flex:none;display:flex;align-items:center;gap:6px;height:46px;padding:0 8px;background:var(--bg)}
.topbar .mid{flex:1;font-weight:700;font-size:15px;display:flex;align-items:center;gap:5px;color:var(--ink2);white-space:nowrap}
.tbtn{display:flex;align-items:center;gap:4px;height:36px;padding:0 10px;border-radius:10px;background:var(--surface2);font-weight:700;font-size:14px;white-space:nowrap}
.bug{flex:none;margin:0 12px;background:var(--bug);color:#fff;border-radius:16px;display:grid;grid-template-columns:1fr 92px 104px;align-items:center;height:86px;border:1px solid var(--bug-line)}
.bug>*{height:100%;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--bug-line)}
.bug>*:last-child{border-right:0}
.bug-teams{padding:0 12px;gap:4px}
.bug-teams div{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;opacity:.55}
.bug-teams div.bat{opacity:1}
.bug-teams i{width:6px;height:24px;border-radius:3px;display:block}
.bug-teams i.us{background:var(--us)}.bug-teams i.them{background:#8FA0B1}
.bug-teams b{margin-left:auto;font-size:26px;font-variant-numeric:tabular-nums}
.bug-teams .arrow{color:var(--amber);font-size:12px;width:10px}
.bug-dia{align-items:center;gap:3px}
.bug-dia svg{width:66px;height:46px}
.bug-dia .dots{color:#fff}
.bug-dia .dots i{width:12px;height:12px}
.mb{fill:none;stroke:#fff;stroke-width:2.2}
.mb.occ{fill:var(--amber);stroke:var(--amber)}
.bug-count{align-items:center}
.bug-count b{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bug-count span{font-size:11px;opacity:.75;font-weight:600;margin-top:3px}
.bug-pitch{flex:none;margin:6px 12px 0;min-height:40px;border-radius:12px;background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px;color:var(--ink3);width:calc(100% - 24px);box-shadow:var(--sh)}
.bug-pitch b{color:var(--ink)}
.bug-pitch .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{flex:1 1 104px;min-height:88px;max-height:150px;margin:8px 12px 0;border-radius:18px;background:var(--us);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;width:calc(100% - 24px);position:relative;overflow:hidden}
.t-them .hero{background-color:var(--them);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 10px,transparent 10px 20px)}
.hero .hl{flex:1;min-width:0}
.hero small{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero .hn{display:flex;align-items:baseline;gap:10px;margin:2px 0}
.hero .hn em{font-style:normal;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.hero .hn b{font-size:24px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.hero .hs{font-size:14.5px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .od{flex:none;text-align:right;font-size:12px;opacity:.85;font-weight:600;max-width:96px}
.hero .od b{display:block;font-size:15px;opacity:1}
.hero .addname{color:#fff;text-decoration:underline}
.pad3{flex:1 1 140px;min-height:100px;max-height:210px;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;padding:10px 12px 0}
.pad3 .called{top:auto;bottom:6px;left:6px;right:6px;height:38px;width:auto}
.pad3 .cb.strike{justify-content:flex-start;padding-top:18px}
.padip{flex:0 1 86px;min-height:66px;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 0}
.padip .cb{font-size:24px}
.padip .cb small{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;opacity:.8}
.bottomrow{flex:none;display:grid;grid-template-columns:1fr 1.65fr;gap:10px;padding:10px 12px calc(var(--sb) + 2px)}
.bottomrow .songbar{margin:0;width:100%;min-height:64px;padding:0 10px 0 8px;gap:8px}
.bottomrow .songbar .sb-ic{width:40px;height:40px}
.bottomrow .songbar .sb-t b{font-size:16px}
.bottomrow .songbar .sb-t span{font-size:12px}
.undobig{border-radius:18px;background:var(--surface2);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:17px;min-height:64px;padding:0 8px}
.undobig span{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.undobig small{font-size:12px;font-weight:600;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.undobig:disabled{opacity:.45}

/* ---------- In-play sequence ---------- */
.fhead{flex:none;height:50px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 6px;background:var(--bg)}
.fhead .t{text-align:center;font-weight:800;font-size:17px;white-space:nowrap}
.fhead .t small{display:block;font-weight:600;font-size:12px;color:var(--ink3)}
.ctx{flex:none;display:flex;align-items:center;gap:8px;margin:0 12px;padding:8px 12px;border-radius:12px;font-size:14px;font-weight:600}
.ctx.us{background:var(--us-soft);color:var(--us-text)}
.ctx.them{background:var(--them-soft);color:var(--them-text)}
.steps{display:flex;gap:4px;margin-left:auto}
.steps i{width:22px;height:5px;border-radius:3px;background:currentColor;opacity:.25;display:block}
.steps i.on{opacity:1}
.resgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(64px,1fr);gap:10px;padding:12px 12px calc(var(--sb) + 8px);overflow:auto}
.resgrid .rb{text-align:center;padding:4px 8px;border-radius:16px;font-weight:800;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--play);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.resgrid .rb small{font-size:13px;font-weight:600;opacity:.85}
.resgrid .rb.wide{grid-column:1/-1;font-size:28px}
.resgrid .rb.dark{background:var(--foul)}
.resgrid .rb.lite{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.resgrid .rb.more{background:var(--surface2);color:var(--ink);box-shadow:none;font-size:18px}
.resgrid .rb.sm{font-size:17px}
.notebar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px 4px}
.notebar .nt{flex:1;min-width:0}
.notebar .nt b{font-size:40px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1;display:block;white-space:nowrap}
.notebar .nt b.ph{color:var(--ink3);font-size:19px;font-weight:700;line-height:1.2;white-space:normal;min-height:40px;display:flex;align-items:center}
.notebar .nt span{font-size:14px;color:var(--ink3)}
.kinds{flex:none;display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0}
.kinds::-webkit-scrollbar{display:none}
.kinds .chipbtn{flex:none;padding:0 12px}
.kinds .sep{width:1px;background:var(--line);flex:none;margin:4px 2px}
.bigfield{flex:1 1 0;min-height:150px;position:relative;margin:6px 0 0}
.bigfield .field{position:absolute;inset:0}
.hint{position:absolute;left:0;right:0;top:0;text-align:center;font-size:13px;font-weight:600;color:var(--ink2);pointer-events:none}
.bottombar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px calc(var(--sb) + 4px);background:var(--surface);border-top:1px solid var(--line)}
.bottombar .sum{flex:1;min-width:0;font-size:14px;color:var(--ink3);line-height:1.25}
.bottombar .sum b{display:block;color:var(--ink);font-size:16px}
.bottombar .btn{width:auto;min-width:132px;min-height:56px;font-size:19px}
.inningover{background:var(--danger);color:#fff;border-radius:10px;padding:2px 8px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em;display:inline-block;margin-top:2px}
.runsum{flex:none;display:flex;align-items:center;gap:12px;margin:6px 12px 0;padding:10px 12px;background:var(--surface);border-radius:14px;box-shadow:var(--sh)}
.runsum .nt{flex:1;min-width:0}
.runsum .nt b{font-size:26px;font-weight:800;display:block;line-height:1.1}
.runsum .nt span{font-size:14px;color:var(--ink3)}
.rbi{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.runfield{flex:1 1 0;min-height:110px;position:relative;margin-top:4px}
.runfield .field{position:absolute;inset:0}
.rrows{flex:none;padding:4px 12px 4px;display:flex;flex-direction:column;gap:6px}
.rrow{display:flex;align-items:center;gap:8px}
.rwho{width:84px;flex:none;line-height:1.15}
.rwho b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rwho small{font-size:12px;color:var(--ink3)}
.rseg{flex:1}
.rseg button{min-height:44px;font-size:14.5px;position:relative;padding:0 2px}
.rseg button.on{background:var(--play);color:#fff}
.rseg button.on.o{background:var(--danger)}
.rseg .sg{position:absolute;left:50%;bottom:4px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55;transform:translateX(-50%)}
.k3opts{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 12px calc(var(--sb) + 8px)}
.k3opts .rb{flex:1;max-height:170px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:24px;font-weight:800;color:#fff;background:var(--foul);text-align:center;padding:10px}
.k3opts .rb.safe{background:var(--play)}
.k3opts .rb small{font-size:14px;font-weight:600;opacity:.85}

/* ---------- Sheets ---------- */
#sheetLayer{position:absolute;inset:0;z-index:60;pointer-events:none}
#sheetLayer.open{pointer-events:auto}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.enter{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--surface3);margin:7px auto 0;flex:none}
.sh-head{flex:none;display:grid;grid-template-columns:84px 1fr 84px;align-items:center;padding:2px 6px 6px}
.sh-head .t{text-align:center;font-weight:800;font-size:17px;line-height:1.2}
.sh-head .t small{display:block;font-weight:500;font-size:13px;color:var(--ink3)}
.sh-body{flex:1;overflow-y:auto;padding:4px 14px 12px;min-height:0}
.sh-foot{flex:none;padding:10px 14px calc(var(--sb) + 6px);background:var(--bg);border-top:1px solid var(--line)}
.sh-foot .btn{min-height:56px;font-size:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.card .opt:last-child{border-bottom:0}
.opt .grow{flex:1;min-width:0}
.opt .t1{font-size:17px;font-weight:600}
.opt .t2{font-size:13.5px;color:var(--ink3)}
.opt .radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface3);flex:none;display:grid;place-items:center}
.opt.on .radio{border-color:var(--play);background:var(--play);color:#fff}
.opt .oic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);color:var(--ink);flex:none}
.opt.changed{background:#FFF6DC}
:root[data-theme="dark"] .opt.changed{background:#3a3016}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.changed{background:#3a3016}}
.posnum{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.picker{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 14px;background:var(--surface2);border-bottom:1px solid var(--line)}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.agrid button{min-height:60px;border-radius:14px;background:var(--surface);font-weight:700;font-size:16px;box-shadow:var(--sh);padding:6px 10px;text-align:center}
.agrid button small{display:block;font-weight:500;font-size:12.5px;color:var(--ink3)}
.field-in{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field-in label{font-size:13px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.field-in input{height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:18px}
.info{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.4;margin:10px 0}
.info b{color:var(--ink)}

/* ---------- Teams, songs, pregame ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--surface);border-radius:16px;padding:14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--sh);text-align:left}
.tile b{font-size:17px}
.tile span{font-size:13px;color:var(--ink3)}
.tile .ti{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);color:var(--ink)}
.tile.pri{background:var(--us);color:#fff}.tile.pri span{color:#fff;opacity:.85}.tile.pri .ti{background:rgba(255,255,255,.2);color:#fff}
.resume{display:block;width:100%;margin-top:14px;background:var(--surface);border-radius:18px;box-shadow:var(--sh);overflow:hidden;text-align:left}
.resume .rt{display:flex;justify-content:space-between;padding:12px 14px 0;font-size:13px;font-weight:700;color:var(--ink3)}
.resume .live{color:var(--danger)}
.resume .rs{display:grid;grid-template-columns:1fr 1fr;padding:8px 14px 12px;gap:10px}
.resume .rs div{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:17px}
.resume .rs b{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.resume .rc{background:var(--us);color:#fff;font-weight:800;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:17px}
.lpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lp{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--sh);display:flex;gap:10px;align-items:center;border:2.5px solid transparent;text-align:left}
.lp.on{border-color:var(--play)}
.lp svg{flex:none}
.lp b{display:block;font-size:15px}
.lp span{font-size:12.5px;color:var(--ink3);line-height:1.25;display:block}
.lp .tc{font-size:20px;font-weight:800;color:var(--ink);display:block;margin-top:4px}
.mocktag{font-size:10.5px;background:var(--amber);color:#111;border-radius:5px;padding:2px 6px;letter-spacing:.04em}
.plhead{display:flex;align-items:center;gap:14px;padding:6px 16px 4px}
.plhead h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.plhead p{margin:2px 0 0;color:var(--ink3);font-size:15px}
.cardpad{padding:14px}
.cardpad h4{margin:0 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.songline{display:flex;align-items:center;gap:12px}
.songline .art{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--us),#5a0b1a);display:grid;place-items:center;color:#fff;flex:none}
.songline b{font-size:18px;display:block}
.songline span{font-size:14px;color:var(--ink3)}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{min-height:46px;font-size:15px}
.script-q{font-family:var(--serif);font-style:italic;font-size:16.5px;line-height:1.4;background:var(--surface2);border-radius:12px;padding:12px 14px;margin:10px 0}
.recbig{width:96px;height:96px;border-radius:50%;border:5px solid var(--ink3);display:grid;place-items:center;margin:8px auto}
.recbig i{display:block;width:70px;height:70px;border-radius:50%;background:var(--danger);transition:all .2s}
.recbig.on i{width:36px;height:36px;border-radius:9px}
.wave{display:flex;align-items:center;gap:2px;height:56px;justify-content:center}
.wave i{width:3px;border-radius:2px;background:var(--ink3);display:block}
.wave.live i{background:var(--danger);animation:eq .6s ease-in-out infinite}
.rectime{text-align:center;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.wavebox{position:relative;height:90px;background:var(--surface2);border-radius:12px;overflow:hidden;cursor:pointer}
.wavebox svg{position:absolute;inset:0;width:100%;height:100%}
.wavebox .wf{fill:var(--ink3);opacity:.55}
.wavebox .wf.after{fill:var(--us);opacity:1}
.wavebox .cue{stroke:var(--us);stroke-width:3}
.nudges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.nudges button{min-height:44px;border-radius:11px;background:var(--surface2);font-weight:700}
input[type=range]{width:100%;accent-color:var(--us);height:32px}
.lrow{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.lrow .ord{width:22px;text-align:right;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums}
.lrow .grip{color:var(--ink3)}
.lrow .grow{flex:1;min-width:0}
.lrow .t1{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poschip{min-width:48px;height:36px;border-radius:9px;background:var(--surface2);font-weight:800;font-size:14px;padding:0 8px}
.nrchip{height:36px;border-radius:9px;border:1.5px dashed var(--ink3);font-weight:700;font-size:12px;padding:0 8px;color:var(--ink3);white-space:nowrap}
.nrchip.on{background:var(--amber);border:1.5px solid var(--amber);color:#111}
.stepdots{display:flex;gap:4px;justify-content:center;margin:2px 0 0}
.stepdots i{width:18px;height:4px;border-radius:2px;background:var(--surface3);display:block}
.stepdots i.on{background:var(--play)}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px;background:var(--surface);border-radius:14px;box-shadow:var(--sh);margin-bottom:10px;border:2.5px solid transparent;text-align:left}
.choice.on{border-color:var(--play)}

const KEYSAY = {ball:'Ball',strike:'Strike',foul:'Foul',inplay:'In play','b-out':'Out','b-safe':'Safe or hit','r-out':'Out','r-1B':'Single','r-E':'Error',dp:'Double play',
  f3:'3',f4:'4',f5:'5',f6:'6',f8:'8',next:'Runners',save:'Save',where:'Tap left field','run-diaz-4':'Diaz: Home','run-batter-2':'Batter: 2nd',k3:'Dropped 3rd strike',

// ---------- Stand-in rules engine (the real one lives in the GameEngine module) ----------
function newP(r){ return {result:r, kind:'ground', guessed:true, dp:false, tp:false, seq:[], loc:null, locPos:null, out:null, rbi:null, err:null, errType:null}; }
const HITS = {'1B':1,'2B':2,'3B':3,'HR':4};
function suggest(){
  const b=S.bases, bat=batter(), r=P.result, out=[];
  const forced = {1:true, 2:!!b[1], 3:!!(b[1]&&b[2])};
  const runners = [3,2,1].filter(i=>b[i]).map(i=>({p:b[i],from:i}));
  const add = (p,from,to) => out.push({p:clone(p),from,to,sugg:to});
  if(['out','SF','SH','K3out'].includes(r)){
    let outsLeft = (P.dp?1:0) + (P.tp?2:0);
    runners.slice().reverse().forEach(x=>{          // lowest base first: the forced runners get doubled up
      let to = x.from;
      if(outsLeft>0 && forced[x.from]){ to='out'; outsLeft--; }
      else if(r==='SF' && x.from===3) to=4;
      else if(r==='SH') to=Math.min(4,x.from+1);
      x.to=to;
    });
    runners.forEach(x=>add(x.p,x.from,x.to));
    add(bat,0,'out');
  } else if(HITS[r]){
    runners.forEach(x=>add(x.p,x.from,Math.min(4,x.from+HITS[r])));
    add(bat,0,HITS[r]);
  } else if(r==='FC'){
    const lead = [3,2,1].find(i=>b[i]&&forced[i]);
    runners.forEach(x=>add(x.p,x.from, x.from===lead ? 'out' : (forced[x.from]?x.from+1:x.from)));
    add(bat,0,1);
  } else { // error, catcher's interference, dropped third strike with the batter safe
    runners.forEach(x=>add(x.p,x.from, forced[x.from]?x.from+1:x.from));
    add(bat,0,1);
  }
  return out;
}
const outsOf = o => o.filter(x=>x.to==='out').length;
const runsOf = o => o.filter(x=>x.to===4).length;
function rbiNow(){
  if(P.rbi!=null) return P.rbi;
  const o = P.out || suggest();
  if(P.result==='E' || P.dp || P.tp || P.result==='K3safe') return 0;
  return runsOf(o);
}
function guessKind(){ if(!P.guessed) return; P.kind = (P.seq.length===1 && P.seq[0]>=7) ? 'fly' : 'ground'; }
function notation(){
  const r=P.result, sq=P.seq;
  if(r==='out'){
    let n;
    if(!sq.length) n='';
    else if(sq.length===1) n = P.kind==='ground' ? sq[0]+'U' : ({fly:'F',line:'L',pop:'P',bunt:'B'}[P.kind]+sq[0]);
    else n = sq.join('-') + (P.kind==='bunt'?' bunt':'');
    if(n && P.dp) n+=' DP'; if(n && P.tp) n+=' TP';
    return n;
  }
  if(r==='FC') return sq.length ? 'FC '+sq.join('-') : '';
  if(r==='SF') return sq.length ? 'SF'+sq[0] : '';
  if(r==='SH') return sq.length ? 'SH '+sq.join('-') : '';
  if(r==='E') return P.err ? 'E'+P.err : '';
  if(r==='CI') return 'CI';
  if(r==='K3out') return sq.length ? 'K '+sq.join('-') : '';
  if(r==='K3safe') return 'K, safe at 1st';
  if(HITS[r]) return r + (P.locPos ? ' '+P.locPos : '');
  return '';
}
function describe(){
  const r=P.result, sq=P.seq;
  if(r==='out'){
    if(!sq.length) return 'Tap the fielders in the order they handled it';
    const k={ground:'Ground out',fly:'Fly out',line:'Line out',pop:'Pop out',bunt:'Bunt out'}[P.kind];
    if(sq.length===1) return `${k} to ${WHERE[sq[0]]}`;
    return `${k}, ${sq.map(n=>POSLONG[n].toLowerCase()).join(' to ')}${P.dp?', double play':''}${P.tp?', triple play':''}`;
  }
  if(HITS[r]) return ({'1B':'Single','2B':'Double','3B':'Triple','HR':'Home run'}[r]) + (P.locPos ? ` to ${WHERE[P.locPos]}` : '');
  if(r==='E') return P.err ? `Error on the ${POSLONG[P.err].toLowerCase()}`+(P.errType?` (${P.errType})`:'') : 'Tap the fielder who made the error';
  if(r==='FC') return 'Fielder’s choice';
  if(r==='SF') return 'Sacrifice fly'; if(r==='SH') return 'Sacrifice bunt';
  if(r==='K3out') return 'Strikeout, thrown out at first'; if(r==='K3safe') return 'Strikeout, batter reached first';
  if(r==='CI') return 'Catcher’s interference';
  return '';
}
const needRunners = () => [1,2,3].some(i=>S.bases[i]) || ['E','FC','CI','K3safe'].includes(P.result);

// ---------- Recording events (each one can be undone in one tap) ----------
function pushUndo(label){ undo.push({label, S:clone(S)}); if(undo.length>60) undo.shift(); }
function prePitch(label){ pushUndo(label); S.banner=null; S.k3=null; ui.music=false; if(ui.autoFade) ui.song=false; }
function pc(strike){ const p=S.pit[fieldTeam()]; p.p++; if(strike) p.st++; }
function endPA(){ lastPA=taps; taps=0; }
function addToday(p,n){ (S.today[p.id]=S.today[p.id]||[]).push(n); }
function nextBatter(){ S.b=0; S.s=0; S.idx[batTeam()]++; ui.song=false; endPA(); }
function reach(note, say){
  const t=batTeam(), p=batter(), b=S.bases; let runs=0;
  if(b[1]){ if(b[2]){ if(b[3]) runs++; b[3]=b[2]; } b[2]=b[1]; }
  b[1]=clone(p); S.score[t]+=runs; addToday(p,note); nextBatter();
  toast(`${say}: ${nm(p)} to first${runs?', a run scores':''}`); checkNR();
}
function strikeout(called){
  const p=batter(); addToday(p, called?'Kc':'K'); S.outs++; nextBatter();
  toast(`Strikeout${called?' looking':''}: ${nm(p)}, ${S.outs} out${S.outs>1?'s':''}`);
  if(S.outs>=3) endHalf(); else S.k3={id:p.id};
}
function endHalf(){
  const wasBot = S.half==='bot', inn=S.inning;
  if(wasBot){ S.inning++; S.half='top'; } else S.half='bot';
  S.outs=0; S.b=0; S.s=0; S.k3=null; S.bases={1:null,2:null,3:null};
  S.banner = {t:(wasBot?'End ':'Middle ')+ord(inn), sc:`Cardinals ${S.score.us}, Mudcats ${S.score.them}`, def:wasBot};
  if(wasBot){ sheet='defense'; ui.def=null; ui.defOpen=null; ui.defChanged={}; }
}
function checkNR(){
  if(batTeam()!=='us') return;
  for(const i of [1,2,3]) if(S.bases[i] && S.bases[i].nr){ sheet='nr'; ui.nrBase=i; ui.nrPick=null; return; }
}
function savePlay(){
  const o = P.out || suggest(), note = notation(), say = describe(), team = batTeam(), bat = batter();
  if(P.result && P.result.startsWith('K3') && P.fromStrike){ undo[undo.length-1].label='dropped 3rd strike'; }
  else pushUndo(note);
  const nb={1:null,2:null,3:null}; let outs=0, runs=0;
  o.forEach(x=>{ if(x.to==='out') outs++; else if(x.to===4) runs++; else nb[x.to]=x.p; });
  S.bases=nb; S.outs+=outs; S.score[team]+=runs; pc(true);
  addToday(bat, P.result && P.result.startsWith('K3') ? 'K' : note);
  S.banner=null; S.k3=null; ui.music=false;
  P=null; route='bat'; nextBatter();
  const msg = `${say}${runs?`, ${runs} run${runs>1?'s':''} in`:''}${S.outs>=3?'. Three outs.':''}`;
  if(S.outs>=3) endHalf();
  toast(msg);
  checkNR();
}

// ---------- The field drawing ----------
const BXY = {0:[160,262],1:[231,191],2:[160,120],3:[89,191],4:[160,262]};
const PXY = {1:[160,193],2:[160,292],3:[238,160],4:[204,113],5:[82,160],6:[116,113],7:[64,64],8:[160,36],9:[256,64]};
const PILLXY = {1:[244,226],2:[160,96],3:[76,226],4:[160,282]};
let fid = 0;
function fieldBG(){
  return `<path class="g-grass" d="M160,262 L10,112 A160,160 0 0 1 310,112 Z"/>
  <path class="g-dirt" d="M160,282 L62,184 A100,100 0 0 1 258,184 Z"/>
  <path class="g-grass2" d="M160,247 L216,191 L160,135 L104,191 Z"/>
  <circle class="g-dirt" cx="160" cy="262" r="17"/>
  <path class="g-line" d="M160,262 L10,112 M160,262 L310,112"/>
  <circle class="mound" cx="160" cy="193" r="9"/>`;
}
function baseShape(i, cls=''){ const [x,y]=BXY[i]; return `<rect class="base ${cls}" x="-8" y="-8" width="16" height="16" rx="2" transform="translate(${x} ${y}) rotate(45)"/>`; }
const plate = () => `<path class="base" d="M152,257 h16 v6 l-8,7 l-8,-7z"/>`;
function pill(x,y,text,cls,attrs=''){
  const w = Math.max(46, text.length*8.4+22);
  return `<g class="pill ${cls}" ${attrs}><rect class="hit" x="${x-w/2-6}" y="${y-20}" width="${w+12}" height="40" fill="transparent" stroke="none"/><rect x="${x-w/2}" y="${y-14}" width="${w}" height="28" rx="14"/><text x="${x}" y="${y+5}" text-anchor="middle">${esc(text)}</text></g>`;
}
function basePath(from,to){ const pts=[]; for(let i=from;i<=to;i++) pts.push(BXY[i]); return pts; }
function field(o){
  const id='fd'+(++fid), m=o.mode, team=o.team||'us';
  const vb = (m==='bat'||m==='runners') ? '22 76 276 216' : '0 0 320 322';
  let s = `<svg class="field" viewBox="${vb}" preserveAspectRatio="xMidYMid meet" style="--arrow:var(--${team})" ${m==='where'?'data-a="where" data-k="where"':''} role="img" aria-label="Field">
  <defs><marker id="${id}t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="${id}r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0,0L10,5L0,10z" class="ahr"/></marker></defs>
  ${fieldBG()}`;
  if(m==='bat'){
    [1,2,3].forEach(i=>{ s += baseShape(i, o.runners[i] ? 'occ '+team : ''); });
    s += plate();
    [3,2,1].forEach(i=>{ const r=o.runners[i]; if(r){ const [x,y]=PILLXY[i]; s += pill(x,y,nm(r),team,`data-a="runner" data-v="${i}" role="button" aria-label="${esc(nm(r))} on ${BASEN[i]}"`); } });
  }
  if(m==='pick' || m==='where'){
    [1,2,3].forEach(i=>{ s += baseShape(i); }); s += plate();
    if(m==='pick' && o.seq.length>1){
      for(let i=0;i<o.seq.length-1;i++){ const a=PXY[o.seq[i]], b=PXY[o.seq[i+1]]; if(o.seq[i]===o.seq[i+1]) continue;
        const dx=b[0]-a[0], dy=b[1]-a[1], d=Math.hypot(dx,dy), ux=dx/d, uy=dy/d;
        s += `<path class="throw" d="M${a[0]+ux*22},${a[1]+uy*22} L${b[0]-ux*25},${b[1]-uy*25}" marker-end="url(#${id}t)"/>`; }
    }
    for(let n=1;n<=9;n++){
      const [x,y]=PXY[n], sel=o.seq.includes(n), name=o.names&&o.names[n];
      const cls = m==='where' ? 'faint' : (sel ? (o.err?'err sel':'sel') : '');
      s += `<g class="fld ${cls}" ${m==='pick'?`data-a="fielder" data-v="${n}" data-k="f${n}" role="button" aria-label="${POSLONG[n]}"`:''}>
        <circle class="hit" cx="${x}" cy="${y}" r="27"/><circle class="fc" cx="${x}" cy="${y}" r="19"/><text class="fn" x="${x}" y="${y+6.5}">${n}</text>
        ${name?`<text class="fname" x="${x}" y="${y+33}">${esc(name)}</text>`:''}`;
      o.seq.forEach((q,k)=>{ if(q===n && !o.err){ const bx=x+15+(k>2?0:0), by=y-15-(o.seq.slice(0,k).filter(z=>z===n).length*16); s+=`<g class="badge"><circle cx="${bx}" cy="${by}" r="9"/><text x="${bx}" y="${by+4}">${k+1}</text></g>`; } });
      s += `</g>`;
    }
    if(m==='where' && o.loc){ s += `<g class="locmark"><circle class="ring" cx="${o.loc[0]}" cy="${o.loc[1]}" r="16"/><circle cx="${o.loc[0]}" cy="${o.loc[1]}" r="8"/></g>`; }
  }
  if(m==='runners'){
    [1,2,3].forEach(i=>{ s += baseShape(i); }); s += plate();
    const pills=[];
    o.out.forEach(x=>{
      const dest = x.to==='out' ? Math.min(4, x.from+1) : x.to;
      if(x.to==='out' && x.from===0 && o.fly){ pills.push(pill(160,282,nm(x.p)+' out','out')); return; }
      if(dest!==x.from){
        const pts=basePath(x.from,dest);
        s += `<polyline class="runpath ${x.to==='out'?'out':''}" points="${pts.map(p=>p.join(',')).join(' ')}" ${x.to==='out'?'':`marker-end="url(#${id}r)"`}/>`;
      }
      if(x.to==='out'){ const [bx,by]=BXY[dest]; s += `<path class="xmark" d="M${bx-9},${by-9}L${bx+9},${by+9}M${bx+9},${by-9}L${bx-9},${by+9}"/>`; }
      const [px,py]=PILLXY[dest];
      pills.push(pill(px,py,nm(x.p)+(x.to==='out'?' out':''), x.to==='out'?'out':team));
    });
    [1,2,3].forEach(i=>{ if(o.out.some(x=>x.to===i)) s += baseShape(i,'occ '+team); });
    s += pills.join('');
  }
  return s + '</svg>';
}

  const pts={2:[33,10],1:[54,30],3:[12,30]};
  return `<svg viewBox="0 0 66 44" aria-hidden="true">${[1,2,3].map(i=>`<rect class="mb ${b[i]?'occ':''}" x="-8" y="-8" width="16" height="16" rx="2" transform="translate(${pts[i][0]} ${pts[i][1]}) rotate(45)"/>`).join('')}</svg>`;

function sayNum(n){ const w=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen']; const t={2:'twenty',3:'thirty',4:'forty',5:'fifty',6:'sixty',7:'seventy',8:'eighty',9:'ninety'}; if(n<20) return w[n]; const d=Math.floor(n/10), u=n%10; return t[d]+(u?'-'+w[u]:''); }

function waveSVG(frac){
  let r=7, bars=''; const n=90;
  for(let i=0;i<n;i++){ r=(r*9301+49297)%233280; const h=12+ (r/233280)*60*(0.55+0.45*Math.sin(i/7)); const x=i*(320/n)+1; bars+=`<rect class="wf ${i/n>=frac?'after':''}" x="${x.toFixed(1)}" y="${(45-h/2).toFixed(1)}" width="2.2" height="${h.toFixed(1)}" rx="1"/>`; }
  return `<svg viewBox="0 0 320 90" preserveAspectRatio="none">${bars}<line class="cue" x1="${frac*320}" x2="${frac*320}" y1="0" y2="90"/></svg>`;
}

function seasonRows(){
  return SEASON.map(r=>{ const [n,g,ab,run,h,d,t,hr,rbi,bb,k,hbp,sf]=r; const pa=ab+bb+hbp+sf, tb=h+d+2*t+3*hr;
    return {name:n,g,pa,ab,r:run,h,d,t,hr,rbi,bb,k, avg:ab?h/ab:null, obp:pa?(h+bb+hbp)/pa:null, slg:ab?tb/ab:null}; });
}
const rate = v => v==null ? '—' : (v>=1 ? v.toFixed(3) : v.toFixed(3).slice(1));
SCREENS.season = () => {
  const bat = ui.stab==='bat';
  let table='';
  if(bat){
    const cols=[['g','G'],['pa','PA'],['ab','AB'],['r','R'],['h','H'],['d','2B'],['t','3B'],['hr','HR'],['rbi','RBI'],['bb','BB'],['k','K'],['avg','AVG'],['obp','OBP'],['slg','SLG']];
    const rows=seasonRows(), k=ui.sort.k, d=ui.sort.d, isRate=['avg','obp','slg'].includes(k);
    const hide = r => ui.minPA && r.pa<10;
    rows.sort((a,b)=>{ const av=(isRate&&hide(a))?null:a[k], bv=(isRate&&hide(b))?null:b[k]; if(av==null&&bv==null) return 0; if(av==null) return 1; if(bv==null) return -1; return (av-bv)*d; });
    table = `<table class="stbl"><tr><th class="nm">Player</th>${cols.map(([c,l])=>`<th class="${c===k?'sorted':''}"><button data-a="sort" data-v="${c}">${l}${c===k?(d<0?' ↓':' ↑'):''}</button></th>`).join('')}</tr>
      ${rows.map(r=>`<tr><td class="nm">${r.name}</td>${cols.map(([c])=>{ const v=r[c]; if(['avg','obp','slg'].includes(c)) return `<td class="rate ${hide(r)?'dim':''}">${hide(r)?'—':rate(v)}</td>`; return `<td>${v}</td>`; }).join('')}</tr>`).join('')}</table>`;
  } else {
    table = `<table class="stbl"><tr><th class="nm">Pitcher</th>${['G','W-L','IP','H','R','ER','BB','K','ERA','WHIP'].map(h=>`<th>${h}</th>`).join('')}</tr>
      ${PSEASON.map(([n,g,o,h,r,er,bb,k,w,l])=>{ const ip=o/3; return `<tr><td class="nm">${n}</td><td>${g}</td><td>${w}-${l}</td><td>${Math.floor(o/3)}${o%3?'.'+(o%3):''}</td><td>${h}</td><td>${r}</td><td>${er}</td><td>${bb}</td><td>${k}</td><td class="rate">${(er*9/ip).toFixed(2)}</td><td class="rate">${((bb+h)/ip).toFixed(2)}</td></tr>`; }).join('')}</table>`;
  }
  return `<div class="screen">${nav(backBtn('home','Home'),'','')}
  <div class="pad"><h1 class="large">Season</h1><div style="color:var(--ink3);margin-bottom:10px">Cardinals · 14 games · 9 wins, 5 losses</div>
    <div class="seg"><button class="${bat?'on':''}" data-a="stab" data-v="bat">Batting</button><button class="${!bat?'on':''}" data-a="stab" data-v="pitch">Pitching</button></div>
    ${bat?`<div style="display:flex;gap:8px;align-items:center;margin:10px 0"><button class="chipbtn ${ui.minPA?'on':''}" data-a="minPA">At least 10 plate appearances</button><span style="font-size:13px;color:var(--ink3)">for averages</span></div>`:'<div style="height:10px"></div>'}
  </div>
  <div style="flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:calc(var(--sb) + 10px)"><div class="stbl-wrap">${table}</div>
  <div style="font-size:13px;color:var(--ink3);margin:8px 16px 0">Tap a column to sort. The table scrolls sideways; names stay put.</div></div></div>`;
};

  let best=null, bd=1e9; [1,3,4,5,6,7,8,9].forEach(n=>{ const d=Math.hypot(PXY[n][0]-q.x,PXY[n][1]-q.y); if(d<bd){bd=d;best=n;} }); P.locPos=best;
};

function openHash(h){
  curHash=h; P=null; sheet=null; coach=null; ui.more=false;
  const [r,sub]=h.split('/');
  let m;
  if((m=r.match(/^bat-(a|b)-(ours|theirs|nosong)$/))){ L=m[1]; S=preset(m[2]); route='bat'; taps=0; lastPA=null; }
  else if((m=r.match(/^walk-(\w+)$/)) && WALKS[m[1]]) startWalk(m[1]);
  else if(r==='changeover'){ S=preset('co'); route='bat'; sheet='defense'; }
  else if(r.startsWith('step-')){
    const k=r.slice(5);
    const pre = {result:'w63','63':'w63',dp:'wdp',where:'w1b',runners:'w1b',e6:'we6',k3:'wk3'}[k]||'w63';
    S=preset(pre);
    if(k==='result'){ P=newP(null); route='play-result'; }
    if(k==='63'){ P=newP('out'); P.seq=[6,3]; route='play-fielders'; }
    if(k==='dp'){ P=newP('out'); P.dp=true; P.seq=[5,4,3]; route='play-fielders'; }
    if(k==='where'){ P=newP('1B'); P.loc=[70,80]; P.locPos=7; route='play-where'; }
    if(k==='runners'){ P=newP('1B'); P.locPos=7; P.out=suggest(); P.out[0].to=4; route='play-runners'; }
    if(k==='e6'){ P=newP('E'); P.err=6; P.out=suggest(); P.out[0].to=2; route='play-runners'; }
    if(k==='k3'){ P=newP(null); route='play-k3'; }
    if(P) P.cancel=clone(S);
  }
  else if(r.startsWith('sheet-')){
    const k=r.slice(6);
    S = (k==='nr') ? (()=>{ const s=preset('ours'); s.bases[1]=clone(findP('sull')); s.bases[2]=null; s.idx.us=0; return s; })() : k==='defense' ? preset('co') : preset('ours');
    route='bat'; ACT.sheet(k,{dataset:{}}); if(k==='runner') ui.runnerBase=2; if(k==='pr') { ui.prBase=2; ui.prPick='price'; }
  }
  else if(SCREENS[r]){ route=r; if(['overview'].includes(r)&&!S) S=preset('ours'); if(r==='overview') { if(!S||S.half!=='bot') S=preset('ours'); ui.ovTab=sub||'line'; }
    if(sub && SHEETS[sub]) sheet=sub; if(r==='player'&&!sub) ui.player='kow'; if(r==='song'){ ui.songSel='s3'; ui.start=42; ui.vol=90; } }
  else route='home';
  if(!S) S=preset('ours');
  if(route==='bat'||route.startsWith('play')) ui.song=false;
  ixOpen=false;
}

  const lt=left.scrollTop; left.innerHTML=indexHTML(); left.scrollTop=lt;
  const note = NOTES[currentNoteKey()] || '';
  right.innerHTML = `<h2>About this screen</h2><div class="note" style="margin-top:8px">${note}</div>${scriptHTML()}
    <div class="tapbox"><div style="font-size:13px;color:var(--ink3);font-weight:600">Taps in this plate appearance</div><b>${taps}</b>${lastPA!=null?`<div style="font-size:13px;color:var(--ink3)">Last plate appearance took <b style="font-size:15px;color:var(--ink)">${lastPA}</b></div>`:''}</div>
    <div class="note"><div class="decide"><b>Pick one:</b> layout A (8 taps) or layout B (7 taps) for four pitches and a 6-3. The full list of questions is in the README beside this file.</div></div>`;
  const mid = coach ? (coach.i<coach.steps.length ? 'Next: '+(KEYSAY[coach.steps[coach.i]]||'') : 'Done in '+coach.steps.length+' taps') : (route==='bat' ? 'Layout '+L.toUpperCase() : '');
  $('#mockbar').innerHTML = `<button class="mb-btn" data-m="index">☰ Screens</button><div class="mb-mid">${esc(mid)}</div><div class="mb-taps">${taps} taps${lastPA!=null?' · last '+lastPA:''}</div>`;
  const ov=$('#ixov'); ov.classList.toggle('open', ixOpen); if(ixOpen) ov.innerHTML=`<button class="close" data-m="index">Close</button>${indexHTML()}`;
}

// ---------- Render ----------
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }
function render(){
  const app=$('#app'), layer=$('#sheetLayer');
  const scrolls=[...document.querySelectorAll('#app .scroll, #app .stbl-wrap, #sheetLayer .sh-body')].map(e=>[e.scrollTop,e.scrollLeft]);
  const key=route+'|'+sheet+'|'+(route==='overview'?ui.ovTab:'');
  fid=0;
  app.innerHTML=(SCREENS[route]||SCREENS.home)();
  layer.innerHTML = sheet && SHEETS[sheet] ? SHEETS[sheet]() : '';
  layer.classList.toggle('open', !!(sheet && SHEETS[sheet]));
  if(key===lastKey) [...document.querySelectorAll('#app .scroll, #app .stbl-wrap, #sheetLayer .sh-body')].forEach((e,i)=>{ if(scrolls[i]){ e.scrollTop=scrolls[i][0]; e.scrollLeft=scrolls[i][1]; } });
  lastKey=key; prevSheet=sheet;
  const phone=$('#phone');
  phone.dataset.top = (route==='bat' && L==='a') ? batTeam() : 'plain';
  document.querySelectorAll('.coach').forEach(e=>e.classList.remove('coach'));
  if(coach && coach.i<coach.steps.length){ const el=document.querySelector(`#app [data-k="${coach.steps[coach.i]}"], #sheetLayer [data-k="${coach.steps[coach.i]}"]`); if(el) el.classList.add('coach'); }
  renderChrome();
}

// One click handler for the whole page. App taps (data-a / data-go) are counted; mockup controls (data-m) are not.
document.addEventListener('click', e => {
  const m = e.target.closest('[data-m]');
  if(m){
    const v=m.dataset.v;
    if(m.dataset.m==='open'){ openHash(v); history.replaceState(null,'','#'+v); }
    if(m.dataset.m==='setL'){ L=v; if(coach){ coach.steps=WALKS[coach.id][L]; coach.i=0; startWalk(coach.id); } }
    if(m.dataset.m==='theme'){ if(v==='auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=v; }
    if(m.dataset.m==='index'){ ixOpen=!ixOpen; }
    render(); return;
  }
  const el = e.target.closest('[data-a],[data-go]');
  if(!el || el.disabled) return;
  if(el.closest('#app,#sheetLayer')){
    taps++;
    if(coach && coach.i<coach.steps.length && el.dataset.k===coach.steps[coach.i]) coach.i++;
  }
  if(el.dataset.go){ const g=el.dataset.go; if(g==='bat'&&!S) S=preset('ours'); route=g; sheet=null; }
  else { const f=ACT[el.dataset.a]; if(f) f(el.dataset.v, el, e); }
  render();
});
document.addEventListener('input', e => { if(e.target.dataset.in==='vol'){ ui.vol=+e.target.value; } });
// Swipe left on the batting screen for the game overview, right to come back
let sx=null, sy=null;
document.addEventListener('touchstart', e => { sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  if(sx==null || sheet) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
  if(Math.abs(dx)<70 || Math.abs(dy)>Math.abs(dx)) return;
  if(route==='bat' && dx<0){ route='overview'; render(); } else if(route==='overview' && dx>0){ route='bat'; render(); }
}, {passive:true});
// Fit the phone frame to short laptop screens
function fit(){ const ph=$('#phone'); if(innerWidth<=760){ ph.style.transform=''; return; } const s=Math.min(1,(innerHeight-40)/852); ph.style.transform=s<1?`scale(${s})`:''; }
addEventListener('resize', fit);
addEventListener('hashchange', () => { openHash(location.hash.slice(1)||'home'); render(); });
// Start: read the screen from the address (for example #bat-b-ours) and an optional ?theme=dark
const q = new URLSearchParams(location.search); if(q.get('theme')) document.documentElement.dataset.theme=q.get('theme'); if(q.get('layout')) L=q.get('layout');
openHash(location.hash.slice(1)||'home'); fit(); render();
</script>
</body>
</html>
